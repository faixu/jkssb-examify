    <meta charset="UTF-8" />
    <script>
      // Stub Vite HMR WebSocket and suppress WebSocket errors per AI Studio environment constraints (HMR disabled)
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          try {
            var OriginalWebSocket = window.WebSocket;
            var MockHMRWebSocket = function(url, protocols) {
              var isHmr = false;
              if (protocols === 'vite-hmr') isHmr = true;
              if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isHmr = true;
              if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/client') !== -1)) isHmr = true;

              if (isHmr) {
                var emitter = new EventTarget();
                this.url = String(url);
                this.protocol = 'vite-hmr';
                this.readyState = 1; // WebSocket.OPEN
                this.bufferedAmount = 0;
                this.extensions = '';
                this.binaryType = 'blob';
                this.onopen = null;
                this.onmessage = null;
                this.onerror = null;
                this.onclose = null;

                var self = this;
                this.addEventListener = function(type, listener, opts) {
                  emitter.addEventListener(type, listener, opts);
                };
                this.removeEventListener = function(type, listener, opts) {
                  emitter.removeEventListener(type, listener, opts);
                };
                this.dispatchEvent = function(event) {
                  return emitter.dispatchEvent(event);
                };
                this.send = function() {};
                this.close = function() {
                  self.readyState = 3; // CLOSED
                };

                setTimeout(function() {
                  var evt = new Event('open');
                  emitter.dispatchEvent(evt);
                  if (typeof self.onopen === 'function') {
                    try { self.onopen(evt); } catch (e) {}
                  }
                }, 10);

                return this;
              }
              return new OriginalWebSocket(url, protocols);
            };

            MockHMRWebSocket.prototype = OriginalWebSocket.prototype;
            MockHMRWebSocket.CONNECTING = 0;
            MockHMRWebSocket.OPEN = 1;
            MockHMRWebSocket.CLOSING = 2;
            MockHMRWebSocket.CLOSED = 3;
            window.WebSocket = MockHMRWebSocket;
          } catch (e) {}
        }

        var origConsoleError = console.error;
        console.error = function() {
          var text = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg instanceof Error) {
              text += ' ' + arg.message + ' ' + (arg.stack || '');
            } else {
              text += ' ' + String(arg);
            }
          }
          if (
            text.indexOf('WebSocket closed without opened') !== -1 ||
            (text.indexOf('WebSocket') !== -1 && (text.indexOf('@vite/client') !== -1 || text.indexOf('vite') !== -1))
          ) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite-hmr') !== -1 ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var str = String((event && (event.reason && (event.reason.message || event.reason.stack || event.reason))) || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('vite') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
