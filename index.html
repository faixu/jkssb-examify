    <!-- Stub Vite HMR WebSocket in Development Mode -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          try {
            class MockHMRWebSocket extends EventTarget {
              static CONNECTING = 0; static OPEN = 1; static CLOSING = 2; static CLOSED = 3;
              CONNECTING = 0; OPEN = 1; CLOSING = 2; CLOSED = 3;
              constructor(url, protocols) {
                super();
                this.url = String(url);
                this.protocol = Array.isArray(protocols) ? (protocols[0] || '') : (protocols || '');
                this.readyState = 1;
                this.bufferedAmount = 0; this.extensions = ''; this.binaryType = 'blob';
                this.onopen = null; this.onmessage = null; this.onerror = null; this.onclose = null;
                var self = this;
                setTimeout(function() {
                  var openEvt = new Event('open');
                  self.dispatchEvent(openEvt);
                  if (typeof self.onopen === 'function') {
                    try { self.onopen(openEvt); } catch (e) {}
                  }
                }, 0);
              }
              send(data) {}
              close(code, reason) {
                this.readyState = 3;
                var self = this;
                var closeEvt = new CloseEvent('close', { wasClean: true, code: code || 1000, reason: reason || '' });
                self.dispatchEvent(closeEvt);
                if (typeof self.onclose === 'function') {
                  try { self.onclose(closeEvt); } catch (e) {}
                }
              }
            }
            window.WebSocket = MockHMRWebSocket;
          } catch (e) {}

          var origConsoleError = console.error;
          console.error = function() {
            var text = '';
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              text += ' ' + (arg instanceof Error ? arg.message + ' ' + (arg.stack || '') : String(arg));
            }
            if (
              text.indexOf('WebSocket closed without opened') !== -1 ||
              (text.indexOf('WebSocket') !== -1 && (text.indexOf('@vite/client') !== -1 || text.indexOf('vite') !== -1))
            ) {
              return;
            }
            origConsoleError.apply(console, arguments);
          };

          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('vite-hmr') !== -1 ||
              (event.filename && event.filename.indexOf('@vite/client') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var str = String((event && (event.reason && (event.reason.message || event.reason.stack || event.reason))) || '');
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('vite') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);
        }
      })();
